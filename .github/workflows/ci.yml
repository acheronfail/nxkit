name: Build and Test
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux-gnu, macos-arm, macos-intel, win-msvc]
        include:
          - build: linux-gnu
            os: ubuntu-latest
          - build: macos-arm
            os: macos-latest
          - build: macos-intel
            os: macos-13
          - build: win-msvc
            os: windows-2022

    steps:
      # checkout
      - name: Enable symlink support
        run: git config --global core.symlinks true
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # cache
      - uses: actions/cache@v4
        with:
          path: node_modules/
          key: ${{ matrix.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      # install just
      - uses: extractions/setup-just@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # install node
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      # install python (node-gyp@<10 has issues with python3.12)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - if: matrix.os == 'windows-2022'
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          vcpkgGitCommitId: b02e341c927f16d991edbd915d8ea43eac52096c
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
      - if: matrix.os == 'windows-2022'
        name: Set OpenSSL variables
        run: |
          $libSsl = Get-ChildItem -Path $vcpkgRoot -Recurse -Filter libssl.lib | Where-Object { $_.FullName -notmatch '\\debug\\' }
          $opensslLibDir = Split-Path -Path $libSsl.FullName -Parent
          echo "OPENSSL_LIB_DIR=$opensslLibDir" >> $env:GITHUB_ENV
          Write-Host "OPENSSL_LIB_DIR: $opensslLibDir"

          $incSsl = Get-ChildItem -Path $vcpkgRoot -Recurse -Filter evp.h | Select-Object -First 1
          $opensslIncDir = Split-Path -Path (Split-Path -Path $incSsl.FullName -Parent) -Parent
          echo "OPENSSL_INC_DIR=$opensslIncDir" >> $env:GITHUB_ENV
          Write-Host "OPENSSL_INC_DIR: $opensslIncDir"

      # dependencies
      - name: Setup Dependencies
        run: just setup

      # test
      - name: Test XTSN
        run: |
          cd src/node/nand/xtsn
          npm run build
          npm run test

      - name: Test NXKit
        run: just test-all

      # publish
      - name: Test Make
        run: |
          just rebuild-electron
          npm run make
